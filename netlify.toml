[build]
  command = "npm run build"
  publish = "dist/public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg-native"]

# Route API requests to Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Explicitly serve static robots.txt, sitemap.xml, and llms.txt
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/llms.txt"
  to = "/llms.txt"
  status = 200

# Legacy SEO & Canonical 301 Redirects
[[redirects]]
  from = "/about-us"
  to = "/about"
  status = 301

[[redirects]]
  from = "/contact-us"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/press-or-government-program"
  to = "/press"
  status = 301

[[redirects]]
  from = "/google-ads"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/google-ads/"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/best-nasha-mukti-kendra-chhindwara-complete-guide-to-addiction-recovery"
  to = "/blogs/chhindwara-recovery-guide"
  status = 301

[[redirects]]
  from = "/signs-someone-needs-a-nasha-mukti-centre-in-nagpur"
  to = "/blogs/signs-addiction-nagpur"
  status = 301

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy"
  status = 301

# Single Page App fallback for React client routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for crawlers, search engines, and security
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
